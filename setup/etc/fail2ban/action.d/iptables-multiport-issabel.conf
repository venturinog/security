# Fail2Ban configuration file
#
# Author: Cyril Jaquier
# Modified by Yaroslav Halchenko for multiport banning
#
# Issabel: no hace falta duplicar la accion para IPv6. El `before =
# iptables.conf` de abajo trae la seccion condicional `[Init?family=inet6]`
# (iptables = ip6tables -w, blocktype = REJECT --reject-with
# icmp6-port-unreachable), y fail2ban 1.1 ejecuta `actionstart`, `actionstop`
# y cada baneo una vez por familia resolviendo `<iptables>` y `<blocktype>`
# segun la IP. Por eso todo lo que hay aqui usa `<iptables>`: escribir las
# lineas de IPv6 a mano hace que se ejecuten tambien en la pasada de IPv4 y
# duplica las reglas.
#

[INCLUDES]

before = iptables.conf

[Definition]

actionstart_on_demand = false

# Option:  actionstart
# Notes.:  command executed once at the start of Fail2Ban.
# Values:  CMD
#
actionstart = <iptables> -N F2B_INPUT
              <iptables> -C INPUT -j F2B_INPUT || <iptables> -I INPUT 2 -j F2B_INPUT || <iptables> -I INPUT -j F2B_INPUT
              <iptables> -N f2b-<name>
              <iptables> -A f2b-<name> -j <returntype>
              <iptables> -I <chain> -p <protocol> -m multiport --dports <port> -j f2b-<name>

# Option:  actionstop
# Notes.:  command executed once at the end of Fail2Ban
# Values:  CMD
#
actionstop = <iptables> -D <chain> -p <protocol> -m multiport --dports <port> -j f2b-<name>
             <iptables> -D INPUT -j F2B_INPUT
             <iptables> -F f2b-<name>
             <iptables> -X f2b-<name>

# Option:  actioncheck
# Notes.:  command executed once before each actionban command
# Values:  CMD
#
actioncheck = <iptables> -n -L <chain> | grep -q 'f2b-<name>[ \t]'

# Option:  actionban
# Notes.:  command executed when banning an IP. Take care that the
#          command is executed with Fail2Ban user rights.
# Tags:    See jail.conf(5) man page
# Values:  CMD
#
actionban = <iptables> -I f2b-<name> 1 -s <ip> -j <blocktype>
            PAIS=$( (if echo '<ip>' | grep -q ':'; then geoiplookup6 '<ip>'; else geoiplookup '<ip>'; fi) 2>/dev/null | cut -d: -f2 | cut -d, -f1 | sed 's/\s//' ); [ -n "$PAIS" ] || PAIS=ZZ; sqlite3 /var/www/db/attacks.db "INSERT INTO attacks (source,datetime,ip) VALUES ('$PAIS',datetime('now','localtime'),'<ip>')" 2>/dev/null || true

# Option:  actionunban
# Notes.:  command executed when unbanning an IP. Take care that the
#          command is executed with Fail2Ban user rights.
# Tags:    See jail.conf(5) man page
# Values:  CMD
#
actionunban = <iptables> -D f2b-<name> -s <ip> -j <blocktype>

[Init]
